services:
  - type: web
    name: classicalender
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/kopis/*
        destination: http://www.kopis.or.kr/*
      - type: rewrite
        source: /kopis-api/*
        destination: http://www.kopis.or.kr/openApi/restful/*
      - type: rewrite
        source: /*
        destination: /index.html
